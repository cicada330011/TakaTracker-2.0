<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TakaTrack - Wallets</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #13161f; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#13161f] text-slate-100 min-h-screen pb-28 select-none">

    <!-- Top Header -->
    <header class="px-4 py-3 flex justify-between items-center border-b border-slate-800/80 sticky top-0 bg-[#13161f]/95 backdrop-blur-md z-30">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-emerald-500 to-teal-400 flex items-center justify-center font-bold text-white shadow-lg">৳</div>
            <h1 class="font-bold text-lg tracking-tight text-white">Expense Tracker</h1>
        </div>
        <div class="flex items-center space-x-3.5 text-slate-300">
            <span class="relative p-1 cursor-pointer">🔔</span>
            <span class="p-1 text-amber-400 cursor-pointer">☀️</span>
        </div>
    </header>

    <!-- Sub Navigation Tabs -->
    <div class="px-4 py-2.5 flex space-x-2 overflow-x-auto no-scrollbar border-b border-slate-800/80 sticky top-[61px] bg-[#13161f]/95 z-20">
        <a href="index.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>⊞</span><span>Dashboard</span></a>
        <a href="summary.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>📅</span><span>Monthly Summary</span></a>
        <a href="ledger.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>🧾</span><span>Daily Ledger</span></a>
        <a href="wallets.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 flex items-center space-x-1.5"><span>👛</span><span>Wallets</span></a>
        <a href="debts.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>🤝</span><span>ধার ও দেনা</span></a>
    </div>

    <!-- WALLETS MAIN CONTENT -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        <div class="bg-[#1c202d] border border-slate-800 p-5 rounded-3xl space-y-4">
            <div class="flex justify-between items-center">
                <div>
                    <h2 class="font-extrabold text-lg text-white">My Accounts</h2>
                    <p class="text-xs text-slate-400">All available wallets and balances</p>
                </div>
                <button type="button" onclick="alert('নতুন ওয়ালেট তৈরি করার ফিচারটি শীঘ্রই যুক্ত হবে!')" class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-3 py-2 rounded-xl border border-emerald-500/30 flex items-center space-x-1">
                    <span>+ Add New</span>
                </button>
            </div>
            
            <div id="walletsPageGrid" class="grid grid-cols-1 gap-3 pt-2">
                <!-- Wallets will be rendered here by JS -->
            </div>
        </div>
    </main>

    <!-- Bottom Nav Bar -->
    <nav class="fixed bottom-0 inset-x-0 bg-[#1c202d]/95 backdrop-blur-md border-t border-slate-800 px-3 py-2 flex justify-around items-center z-40">
        <a href="index.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>⊞</span><span>Home</span></a>
        <a href="ledger.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>🧾</span><span>Ledger</span></a>
        <div class="flex items-center space-x-2.5 -mt-3">
            <a href="index.html" class="w-12 h-11 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold text-lg flex items-center justify-center shadow-lg">↙</a>
            <a href="index.html" class="w-12 h-11 rounded-2xl bg-rose-500 text-white font-extrabold text-lg flex items-center justify-center shadow-lg">↗</a>
        </div>
        <a href="summary.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>📅</span><span>Summary</span></a>
        <a href="debts.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>🤝</span><span>Debts</span></a>
    </nav>

    <!-- LINK COMMON JS ENGINE -->
    <script src="js/app.js"></script>
    <script>
        // Specific Wallets Render
        const defW = state.defaultWallet;
        document.getElementById('walletsPageGrid').innerHTML = state.wallets.map(w => `
            <div class="bg-[#242938] border ${w.name === defW ? 'border-amber-500/60' : 'border-slate-700/60'} p-4 rounded-2xl flex justify-between items-center">
                <div class="flex items-center space-x-3.5">
                    <span class="w-11 h-11 rounded-xl ${w.color} flex items-center justify-center text-lg text-white shadow-md">${w.icon}</span>
                    <div>
                        <div class="flex items-center space-x-2">
                            <p class="text-sm font-bold text-slate-200">${w.name}</p>
                            ${w.name === defW ? '<span class="text-[9px] bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded font-bold">★ Default</span>' : ''}
                        </div>
                        <p class="text-xs text-slate-400 mt-0.5">Active Account</p>
                    </div>
                </div>
                <div class="text-right">
                    <p class="text-lg font-extrabold text-white">${fmt(w.balance)}</p>
                </div>
            </div>
        `).join('');
    </script>
</body>
</html>
