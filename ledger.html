<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TakaTrack - Daily Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background-color: #13161f; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-[#13161f] text-slate-100 min-h-screen pb-28 select-none">

    <!-- Top Header -->
    <header class="px-4 py-3 flex justify-between items-center border-b border-slate-800/80 sticky top-0 bg-[#13161f]/95 backdrop-blur-md z-30">
        <div class="flex items-center space-x-2.5">
            <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 via-emerald-500 to-teal-400 flex items-center justify-center font-bold text-white shadow-lg">৳</div>
            <h1 class="font-bold text-lg tracking-tight text-white">Expense Tracker</h1>
        </div>
        <div class="flex items-center space-x-3.5 text-slate-300">
            <span class="relative p-1 cursor-pointer">🔔<span class="absolute top-0 right-0 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">1</span></span>
            <span class="p-1 text-amber-400 cursor-pointer">☀️</span>
        </div>
    </header>

    <!-- Sub Navigation Tabs -->
    <div class="px-4 py-2.5 flex space-x-2 overflow-x-auto no-scrollbar border-b border-slate-800/80 sticky top-[61px] bg-[#13161f]/95 z-20">
        <a href="index.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>⊞</span><span>Dashboard</span></a>
        <a href="summary.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>📅</span><span>Monthly Summary</span></a>
        <a href="ledger.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold bg-emerald-500 text-slate-950 flex items-center space-x-1.5"><span>🧾</span><span>Daily Ledger</span></a>
        <a href="wallets.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>👛</span><span>Wallets</span></a>
        <a href="debts.html" class="shrink-0 px-3.5 py-1.5 rounded-xl text-xs font-semibold text-slate-400 hover:text-white flex items-center space-x-1.5"><span>🤝</span><span>ধার ও দেনা</span></a>
    </div>

    <!-- LEDGER MAIN CONTENT -->
    <main class="p-4 max-w-md mx-auto space-y-4">
        <div class="bg-[#1c202d] border border-slate-800 p-5 rounded-3xl space-y-3">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-base text-white">Daily Ledger / History</h3>
                <span class="text-xs text-emerald-400 font-bold">All Records</span>
            </div>
            <div id="ledgerContainer" class="space-y-3 pt-2"></div>
        </div>
    </main>

    <!-- Bottom Nav Bar -->
    <nav class="fixed bottom-0 inset-x-0 bg-[#1c202d]/95 backdrop-blur-md border-t border-slate-800 px-3 py-2 flex justify-around items-center z-40">
        <a href="index.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>⊞</span><span>Home</span></a>
        <a href="ledger.html" class="flex flex-col items-center text-emerald-400 text-[10px] font-bold space-y-1"><span>🧾</span><span>Ledger</span></a>
        <div class="flex items-center space-x-2.5 -mt-3">
            <button type="button" onclick="openTxModal('deposit')" class="w-12 h-11 rounded-2xl bg-emerald-500 text-slate-950 font-extrabold text-lg flex items-center justify-center shadow-lg">↙</button>
            <button type="button" onclick="openTxModal('expense')" class="w-12 h-11 rounded-2xl bg-rose-500 text-white font-extrabold text-lg flex items-center justify-center shadow-lg">↗</button>
        </div>
        <a href="summary.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>📅</span><span>Summary</span></a>
        <a href="debts.html" class="flex flex-col items-center text-slate-400 text-[10px] space-y-1"><span>🤝</span><span>Debts</span></a>
    </nav>

    <!-- LINK COMMON JS ENGINE -->
    <script src="js/app.js"></script>
    <script>
        // Specific Ledger Render
        document.getElementById('ledgerContainer').innerHTML = `
            <div class="divide-y divide-slate-800">
                ${state.transactions.map(t => `
                    <div class="py-3.5 flex justify-between items-center">
                        <div>
                            <p class="font-bold text-xs text-white">${t.category}</p>
                            <p class="text-[10px] text-slate-400">${t.wallet} • ${t.date}</p>
                        </div>
                        <span class="font-bold text-xs ${t.type === 'deposit' ? 'text-emerald-400' : t.type === 'expense' ? 'text-rose-400' : 'text-indigo-400'}">
                            ${t.type === 'deposit' ? '+' : t.type === 'expense' ? '-' : ''}${fmt(t.amount)}
                        </span>
                    </div>
                `).join('')}
            </div>
        `;
    </script>
</body>
</html>
